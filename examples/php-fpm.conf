; A dedicated PHP-FPM pool for DB Admin, e.g. /etc/php/8.3/fpm/pool.d/db-admin.conf
[db-admin]
user = www-data
group = www-data
listen = /run/php/db-admin.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 300
; LOAD DATA LOCAL INFILE is refused by the app itself; this keeps it off at
; the PHP level too.
php_admin_flag[mysqli.allow_local_infile] = off

; Installed as a Composer dependency, keep .env, config.php and storage/
; outside vendor/, which every update replaces.
; env[DB_ADMIN_HOME] = /etc/db-admin

; Configuration can be passed as environment variables instead of .env.
; env[DB_ADMIN_DB_HOST] = 127.0.0.1
; env[DB_ADMIN_PANEL_URL] = https://panel.example.com
